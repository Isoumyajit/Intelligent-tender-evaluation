<header class="ite-gov-header">
  <div class="ite-top-strip" aria-hidden="true"></div>

  <div class="ite-identity-wrap">
    <div class="ite-identity ite-container">
      <div class="ite-brand-block" aria-label="Branding">
        <h1 class="ite-brand-title">Intelligent Tender Evaluation Portal <span class="ite-team">— Team Tricolor Techworks</span></h1>
      </div>
    </div>
  </div>

  <nav class="ite-main-nav" aria-label="Primary">
    <div class="ite-container ite-nav-inner">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/upload" routerLinkActive="active">Upload</a>
      <a
        routerLink="/evaluations"
        routerLinkActive="active"
        class="ite-nav-link-with-badge"
      >
        Evaluations
        @if ((inProgressCount$ | async) ?? 0; as c) {
          @if (c > 0) {
            <span class="ite-nav-badge" aria-label="In-flight tenders">
              {{ c }}
            </span>
          }
        }
      </a>
      <a routerLink="/tenders" routerLinkActive="active">Tender Reports</a>
      <a routerLink="/audit-logs" routerLinkActive="active">Audit Logs</a>
    </div>
  </nav>
</header>
